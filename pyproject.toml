[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "mail-digest"
version = "0.1.1"
description = "Fetch Gmail, classify messages, generate AI daily/weekly/monthly reports, and post Slack summaries"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client==2.197.0",
    "google-auth-oauthlib==1.4.0",
    "httpx==0.28.1",
    "pyyaml==6.0.3",
    "python-dotenv==1.2.2",
    "beautifulsoup4==4.15.0",
    "html2text==2025.4.15",
]

[project.optional-dependencies]
dev = ["pytest==9.0.3", "ruff==0.16.3"]

[project.scripts]
mail-digest = "email_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
